version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Prefer releases that have been public for a while (ADR-versions rule: 14 days).
    cooldown:
      default-days: 14
    ignore:
      # @astrojs/check, svelte-check and typescript-eslint support TypeScript 5-6 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
