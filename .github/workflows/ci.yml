name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pin build date to the last commit (deterministic outputs)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Data build (seed CSVs and crosswalks -> graph -> public/data)
        run: npm run data:build
      - run: npm run test:unit
      - name: Data validation (writes build/report.md; fails on any error)
        run: npm run data:validate -- --mode=preview
      - name: Committed graph inputs are up to date
        run: |
          python3 scripts/link_royce.py
          git diff --exit-code -- crosswalks/instrument-royce.csv || {
            echo "::error::crosswalks/instrument-royce.csv is stale. Run: python3 scripts/link_royce.py"; exit 1; }
      - run: npm run check:attribution
      - run: node scripts/check-no-nld.mjs public/data
      - run: npm run build
      - run: node scripts/check-no-nld.mjs dist
      - run: npx playwright install --with-deps chromium
      - name: Accessibility and map tests (axe WCAG 2.2 AA, keyboard, no NLD requests)
        run: npm run test:e2e
      - name: Data summary
        if: always()
        run: |
          {
            echo "## Data"
            if [ -f build/report.md ]; then head -n 12 build/report.md; fi
            echo
            echo "### Changed data files"
            git diff --stat HEAD~1 -- seed-data crosswalks data 2>/dev/null || echo "(first commit)"
          } >> "$GITHUB_STEP_SUMMARY"
