title = "treaty-land-atlas"

[extend]
useDefault = true

# The relay's unit tests use an obvious placeholder, not a key.
[allowlist]
description = "test placeholders"
regexTarget = "match"
regexes = ['''test-key-not-real''']

[[rules]]
id = "nld-key"
description = "Native Land Digital API key assigned in code or config"
regex = '''(?i)(nld[_-]?key|native[_-]?land[_-]?key)\s*[:=]\s*['"]?[A-Za-z0-9_\-]{16,}'''
