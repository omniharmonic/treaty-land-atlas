                                - rowheader "Mass Register:" [ref=f3e99]
                                - cell "No. 1536" [ref=f3e100]
                    - generic [ref=f3e102]:
                        - paragraph [ref=f3e103]: WHEREAS, indigenous tribes, with rich cultures, histories, and traditions, have continuously inhabited lands within the borders of what is now Massachusetts for centuries, contributing to the fabric of our community in important ways over time;
                        - paragraph [ref=f3e104]: WHEREAS, since its founding, the Commonwealth of Massachusetts has enjoyed a special relationship with the indigenous tribes of the region;
                        - paragraph [ref=f3e105]: WHEREAS, for over three centuries, the Commonwealth has molded this relationship by Treaty and Agreement, Legislative Act and Executive Order, and has never ceased to recognize the special status of these indigenous tribes;
                        - paragraph [ref=f3e106]: WHEREAS, since well before the arrival of the Mayflower, the Herring Pond Wampanoag Tribe has continuously inhabited lands within the borders of what is now Massachusetts, with ancestral homelands stretching from the Plymouth area to the upper reaches of Cape Cod;
                        - paragraph [ref=f3e107]:
                            - text: WHEREAS, official records dating to the 17
                            - superscript [ref=f3e108]: th
                            - text: century reflect the Herring Pond Wampanoag Tribe’s continuous status as a socially and culturally cohesive tribal community within Massachusetts;
                        - paragraph [ref=f3e109]: WHEREAS, the Earle Report of 1861, a census conducted pursuant to Chapter 166 of the Acts of 1859, recognized the Herring Pond Wampanoag Tribe as a distinct and autonomous tribal community then existing within Massachusetts;
                        - paragraph [ref=f3e110]: WHEREAS, the Wampanoag Tribe of Gay Head (Aquinnah) and the Mashpee Wampanoag Tribe—federally-recognized tribes within Massachusetts—enjoy government-to-government relationships with the Herring Pond Wampanoag, and recognize a kinship relationship with the Herring Pond Wampanoag;
                        - paragraph [ref=f3e111]: WHEREAS, the Herring Pond Wampanoag Tribe presently contains close to 200 members, each with a genealogical connection to individuals identified as tribal members in the Earle Report of 1861 or in the Briggs Report of 1859, another governmental census of Native Americans in Massachusetts;
                        - paragraph [ref=f3e112]: WHEREAS, the Herring Pond Wampanoag Tribal Council is the governing body of the Herring Pond Wampanoag Tribe and exercises governmental functions for the Herring Pond Wampanoag Tribe;
                        - paragraph [ref=f3e113]: WHEREAS, the Commission on Indian Affairs acknowledges the Herring Pond Wampanoag Tribe as one of the historic tribes of Massachusetts and the Herring Pond Wampanoag Tribal Council as its governing body;
                        - paragraph [ref=f3e114]: WHEREAS, Executive Order No. 126 instructed state agencies to deal directly with the Mashpee Wampanoag Indian Tribal Council on matters affecting the Mashpee Tribe; with the Wampanoag Tribal Council of Gay Head on matters affecting the Wampanoag Tribe of Gay Head Aquinnah; with the Commission on Indian Affairs on matters affecting Wampanoag Indians who are members of neither the Gay Head nor the Mashpee Tribes; and with the Hassanamisco Nipmuc Tribal Council on matters affecting the Nipmuc Tribe;
                        - paragraph [ref=f3e115]: 'NOW, THEREFORE, I, Maura Healey, Governor of the Commonwealth of Massachusetts, by virtue of all authority vested in me by the Constitution, Part 2, c. 2, § I, Art. I, do hereby order as follows:'
                        - paragraph [ref=f3e116]: Section 1. Like the Mashpee Wampanoag Tribe, the Wampanoag Tribe of Gay Head, and the Hassanamisco Nipmuc Tribe, the Herring Pond Wampanoag Tribe is recognized by the Commonwealth of Massachusetts and the Herring Pond Wampanoag Tribal Council is recognized as its governing body consistent with, and for all purposes under, Executive Order No. 126.
                        - paragraph [ref=f3e117]: Section 2. All executive branch agencies shall deal directly with the Herring Pond Wampanoag Tribal Council on matters affecting the Herring Pond Wampanoag Tribe.
                        - paragraph [ref=f3e118]: This Executive Order shall take effect immediately and shall continue in effect until amended, superseded, or revoked by subsequent Executive Order.
