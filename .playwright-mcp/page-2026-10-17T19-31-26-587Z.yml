                            - generic [ref=f31e125]: 'INDIAN LAW Laws 1909, Chap. 31. AN ACT in relation to Indians, constituting chapter twenty-six of the consolidated laws.Became a law February 17, 1909, with the approval of the Governor.Passed, three-fifths being present.The People of the State of New York, represented in Senate andAssembly, do enact as follows: CHAPTER 26 OF THE CONSOLIDATED LAWS INDIAN LAWArticle 1. Short title (§ 1.) 2. General provisions (§§ 2-19). 3. The Onondaga tribe (§§ 20-28). 4. The Seneca Indians (§§ 40-60). 5. The Seneca Indians on the Allegany and Cattaraugus reservations (§§ 70-79). 6. The Seneca Indians on the Tonawanda Reservation (§§ 80-90). 7. The Tuscarora nation (§§ 95-98). 8. The Saint Regis tribe (§§ 100-114). 9. The Shinnecock tribe (§§ 120-122). 10. The Poospatuck (Unkechauge) Indian Nation (§§ 150-153). 15. Laws repealed; when to take effect (§§ 200-201).'
