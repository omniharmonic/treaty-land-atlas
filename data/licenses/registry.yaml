# License registry (docs/design/J4 s.2-4, J3 s.4.2).
# Single source for attribution text: NOTICE.md and the site's Credits page are generated from it.
# status: pending | cleared | blocked | not_used
# A production build (npm run release:check) fails while any gate for a feature in the build is pending or blocked.

sources:
  - id: usfs-royce
    name: 'Tribal Lands Ceded to the United States (USDA Forest Service)'
    used_in: [layers/cessions, tables/cession-events]
    license_stated: 'CC BY 4.0 (Data.gov); agency metadata: access constraints None, use "for informational purposes only", no explicit license'
    conflict: true
    status: cleared
    evidence: docs/governance/decision-log.md
    evidence_note: 'Owner decision 2026-10-17: treat as open US government data and build with it; revisit if the agency says otherwise. No written agency reply yet.'
    attribution_text: 'Boundary data: Tribal Lands Ceded to the United States, USDA Forest Service (Geospatial Service and Technology Center; Office of Tribal Relations), based on C. C. Royce, Indian Land Cessions in the United States (1899). Modified by Benjamin Life (@omniharmonic): re-projected, simplified, dates and legal types derived. Licensed CC BY 4.0 per Data.gov. Not a legal document; do not use to determine title, ownership, boundaries, or jurisdiction.'
    required_notices: [modified, not legal documents]
    gate: G-01

  - id: loc-royce-1899
    name: 'C. C. Royce, Indian Land Cessions in the United States (1899), Library of Congress'
    used_in: [links]
    license_stated: 'Public domain; credit "Law Library of Congress" (LOC item page)'
    conflict: false
    status: pending
    evidence: null
    attribution_text: 'Source: Royce (1899), Library of Congress, Law Library of Congress.'
    required_notices: []
    gate: G-03

